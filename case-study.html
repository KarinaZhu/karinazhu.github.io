<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Study — Karina Zhu</title>

  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="index.html" class="site-logo" aria-label="Karina Zhu home">
    <svg width="137" height="81" viewBox="0 0 137 81" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M63.5 35.8931H68V39.3931H71V35.3931H76.5V31.8931H81V28.8931H83.5V27.3931H85.5V23.3931H89.5V20.8931H92V18.3931H94V16.8931H96V14.8931H98V12.3931H102.5V10.3931H104.5V8.8931H108.5V6.3931H112V4.3931H119V2.3931H131.5V4.3931H121.5V6.3931H116.5V8.8931H113V10.8931H110.5V13.3931V14.8931H106.5V16.8931H102.5V19.3931H100.5V20.8931H98V23.8931H96V25.8931H94V27.8931H92V29.8931H90V32.3931H88V34.3931H83.5V36.3931H82V37.8931H77.5V40.3931H73.5V42.3931H71V45.3931H60V35.8931H63.5Z" fill="currentColor"/>
    </svg>
  </a>

  <nav class="nav" aria-label="Main navigation" id="nav">
    <a href="index.html#projects" class="nav__link">UI/UX</a>
    <a href="marketing.html" class="nav__link">Marketing</a>
  </nav>

  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to light mode" aria-pressed="false">
    <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"></path></svg>
    <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A8.2 8.2 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2Z"></path></svg>
  </button>

  <main class="csp-wrap" id="csp-root">
    <p class="csp-top"><a href="marketing.html">← Back to case studies</a></p>
    <p style="color:var(--color-text-muted); font-size:13px;">Loading…</p>
  </main>

  <script>
    /* ------------------------------------------------------------------
       Theme init (same behaviour as the rest of the site)
    ------------------------------------------------------------------- */
    (function initTheme() {
      const stored = localStorage.getItem("theme");
      const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      const theme = stored || (prefersLight ? "light" : "dark");
      if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
    })();

    document.addEventListener("DOMContentLoaded", () => {
      const themeToggle = document.getElementById("themeToggle");
      function setPressedState() {
        const isLight = document.documentElement.getAttribute("data-theme") === "light";
        themeToggle?.setAttribute("aria-pressed", String(isLight));
      }
      setPressedState();
      themeToggle?.addEventListener("click", () => {
        const isLight = document.documentElement.getAttribute("data-theme") === "light";
        if (isLight) {
          document.documentElement.removeAttribute("data-theme");
          localStorage.setItem("theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
        }
        setPressedState();
      });

      /* ------------------------------------------------------------------
         Case study data
         Edit / extend this object to add real content, images and
         projects. Each key matches the `data-page` slug used by the
         project list (index.html) and the case-study grid (marketing.html).
      ------------------------------------------------------------------- */
      const CASE_STUDIES = {
        "city2surf": {
          eyebrow: "Case Study · City2Surf",
          title: "A bold, kinetic identity for Sydney's biggest fun run",
          hero: "City2Surf.png",
          meta: { Role: "UI/UX Designer", Context: "Client Project", Timeline: "6 weeks", Tools: "Figma, After Effects" },
          sections: [
            { id: "context", heading: "Context", lead: "City2Surf needed a digital presence as energetic as the run itself.", paragraphs: [
              "The event's website hadn't kept pace with the brand — registration felt like an afterthought and the site did little to build excitement in the lead-up to race day."
            ]},
            { id: "approach", heading: "Approach", paragraphs: [
              "I built a bold identity system around geometric precision and kinetic motion, then carried that language through the logomark, type system, and animated brand expressions across digital and physical touchpoints."
            ]},
            { id: "outcome", heading: "Outcome", paragraphs: [
              "The result is a site and identity that feels as fast and energetic as the run — clear registration flows paired with motion that builds anticipation instead of getting in the way."
            ]}
          ],
          more: ["ocean-echoes-city-rhythms", "crossing-without-crossing"]
        },
        "ocean-echoes-city-rhythms": {
          eyebrow: "Case Study · Ocean Echoes, City Rhythms",
          title: "Device interfaces exploring the pulse of a coastal city",
          hero: "Ocean Echoes, City Rhythms.png",
          meta: { Role: "Product Designer", Context: "Studio Project", Timeline: "8 weeks", Tools: "Figma, Arduino" },
          sections: [
            { id: "context", heading: "Context", lead: "A product concept exploring how ambient data — tide, traffic, tempo — could be felt rather than read.", paragraphs: [
              "The brief asked for an interface that lived outside the screen: something people could glance at, or simply feel in a room."
            ]},
            { id: "approach", heading: "Approach", paragraphs: [
              "I prototyped a small device interface that translates live coastal and city data into light and motion, then designed the companion screens that let people tune which rhythms they wanted to notice."
            ]}
          ],
          more: ["city2surf", "crossing-without-crossing"]
        },
        "crossing-without-crossing": {
          eyebrow: "Case Study · Crossing without Crossing",
          title: "An interactive installation rethinking how people move through public space",
          hero: "yasumo.jpg",
          meta: { Role: "Experience Designer", Context: "Team Project", Timeline: "10 weeks", Tools: "Figma, TouchDesigner" },
          sections: [
            { id: "context", heading: "Context", lead: "How might public space invite a pause instead of just a passage?", paragraphs: [
              "Most crossings are designed purely for throughput. This project asked what a crossing could feel like if it was designed for a moment of connection instead."
            ]},
            { id: "approach", heading: "Approach", paragraphs: [
              "We prototyped an interactive installation that responds to how people move through it — encouraging pedestrians to notice each other rather than just the light change."
            ]}
          ],
          more: ["city2surf", "ocean-echoes-city-rhythms"]
        },
        "hester": {
          eyebrow: "Case Study · Hester",
          title: "A UI/UX exploration in progress",
          hero: "Front end.jpg",
          meta: { Role: "UI/UX Designer", Context: "Personal Project", Timeline: "Ongoing", Tools: "Figma" },
          sections: [
            { id: "context", heading: "Context", lead: "This case study is still being written up.", paragraphs: [
              "Check back soon for the full write-up — or reach out if you'd like a preview."
            ]}
          ],
          more: ["city2surf", "crossing-without-crossing"]
        },

        /* ---- Marketing / archive case studies ---- */
        "unlimited-plus": {
          eyebrow: "Case Study · Unlimited Plus",
          title: "Building the brand and campaign system for Unlimited Plus",
          hero: "Unlimited.png",
          meta: { Role: "Principal Designer", Context: "Agency Work", Timeline: "Ongoing", Tools: "Figma, Illustrator, Premiere" },
          sections: [
            { id: "context", heading: "Context", lead: "As Principal Designer at Unlimited Plus, I lead the visual identity and campaign work across client accounts.", paragraphs: [
              "The role spans brand systems, campaign concepting, and the day-to-day design work that keeps a growing agency's output consistent."
            ]},
            { id: "highlights", heading: "Highlights", paragraphs: [
              "Developed reusable campaign templates that cut turnaround time for client requests, while keeping every deliverable on-brand."
            ]}
          ],
          more: ["poca", "publication"]
        },
        "poca": {
          eyebrow: "Case Study · Poca",
          title: "Packaging and campaign design for Poca",
          hero: "Poca.jpg",
          meta: { Role: "Visual Designer", Context: "Client Project", Timeline: "4 weeks", Tools: "Illustrator, Photoshop" },
          sections: [
            { id: "context", heading: "Context", lead: "Poca needed packaging and campaign assets that stood out on a crowded shelf.", paragraphs: [
              "I developed a visual system that carried across packaging, social content, and in-store collateral."
            ]}
          ],
          more: ["unlimited-plus", "publication"]
        },
        "publication": {
          eyebrow: "Case Study · Publication",
          title: "Editorial layout and print design",
          hero: "Publication.jpg",
          meta: { Role: "Graphic Designer", Context: "Personal Project", Timeline: "3 weeks", Tools: "InDesign" },
          sections: [
            { id: "context", heading: "Context", lead: "A self-directed publication exploring layout rhythm and type hierarchy.", paragraphs: [
              "Each spread experiments with grid structure while keeping the reading experience calm and legible."
            ]}
          ],
          more: ["poca", "unlimited-plus"]
        }
      };

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const data = CASE_STUDIES[id];
      const root = document.getElementById("csp-root");

      if (!data) {
        root.innerHTML = `
          <p class="csp-top"><a href="marketing.html">← Back to case studies</a></p>
          <h1 class="csp-title">Case study not found</h1>
          <p style="margin-top:16px; color:var(--color-text-secondary);">We couldn't find that project. Head back and pick one from the list.</p>
        `;
        return;
      }

      const jump = data.sections.map(s => `<a href="#${s.id}">${s.heading}</a>`).join("");

      const sections = data.sections.map(s => `
        <section class="csp-section" id="${s.id}">
          <h2>${s.heading}</h2>
          ${s.lead ? `<p class="csp-lead">${s.lead}</p>` : ""}
          ${(s.paragraphs || []).map(p => `<p>${p}</p>`).join("")}
        </section>
      `).join("");

      const metaRows = Object.entries(data.meta).map(([k, v]) => `
        <div><dt>${k}</dt><dd>${v}</dd></div>
      `).join("");

      const more = (data.more || []).map(slug => {
        const proj = CASE_STUDIES[slug];
        if (!proj) return "";
        return `
          <a class="csp-more-card" href="case-study.html?id=${slug}">
            <div class="csp-more-thumb"><img src="${proj.hero}" alt="${proj.title}" loading="lazy"></div>
            <div class="csp-more-body">
              <div class="csp-more-title">${proj.title.split(" ").slice(0,3).join(" ")}</div>
              <div class="csp-more-desc">${proj.eyebrow.replace("Case Study · ", "")}</div>
            </div>
          </a>
        `;
      }).join("");

      root.innerHTML = `
        <p class="csp-top"><a href="marketing.html">← Back to case studies</a></p>
        <img class="csp-hero-img" src="${data.hero}" alt="${data.title}">
        <div class="csp-eyebrow">${data.eyebrow}</div>
        <h1 class="csp-title">${data.title}</h1>
        <dl class="csp-meta">${metaRows}</dl>
        <nav class="csp-jump">${jump}</nav>
        ${sections}
        <div class="csp-footer">
          <a class="csp-btn" href="mailto:karliskah@gmail.com">Let's talk about a project →</a>
          <div class="csp-more-label">More case studies</div>
          <div class="csp-more-row">${more}</div>
        </div>
      `;
    });
  </script>
</body>
</html>
